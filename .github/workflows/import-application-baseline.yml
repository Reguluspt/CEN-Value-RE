name: Import application source baseline

on:
  push:
    branches:
      - agent/application-source-baseline
    paths:
      - .github/workflows/import-application-baseline.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CEN-Value-RE
        uses: actions/checkout@v4
        with:
          ref: agent/application-source-baseline
          fetch-depth: 0

      - name: Checkout exact legacy frontend reference
        uses: actions/checkout@v4
        with:
          repository: Reguluspt/New-project
          ref: cc6ad5fcc15703ae31fd9f2e8ee78c972f06d2ff
          path: _legacy

      - name: Import exact web baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf web
          cp -a _legacy/web ./web
          rm -rf _legacy

      - name: Materialize accepted E0-PR-001 source
        shell: bash
        run: |
          set -euo pipefail
          git apply --check E0-PR-001_SERVER_IMPLEMENTATION.patch
          git apply E0-PR-001_SERVER_IMPLEMENTATION.patch
          git apply --check implementation/E0-PR-001_CORRECTIVE_v1.patch
          git apply implementation/E0-PR-001_CORRECTIVE_v1.patch

      - name: Record source provenance
        shell: bash
        run: |
          cat > APPLICATION_SOURCE_BASELINE.md <<'EOF'
          # Application Source Baseline

          **Status:** MATERIALIZED FOR REVIEW
          **Repository of record:** `Reguluspt/CEN-Value-RE`
          **Date:** 2026-08-16

          ## Legacy frontend reference
          `web/` is imported byte-for-byte from the read-only compatibility reference:

          - repository: `Reguluspt/New-project`
          - commit: `cc6ad5fcc15703ae31fd9f2e8ee78c972f06d2ff`
          - source tree: `web/`

          `New-project` is not a write target for CenValue RE.

          ## CenValue RE bounded-context source
          `src/re/` and `tests/re/` are materialized from:

          1. `E0-PR-001_SERVER_IMPLEMENTATION.patch`
          2. `implementation/E0-PR-001_CORRECTIVE_v1.patch`

          E0-PR-001 was independently accepted before this baseline materialization.

          ## Dependency policy
          - `web/package-lock.json` is version-controlled.
          - `node_modules/` is generated by `npm ci` and is never version-controlled.
          - E0-PR-002 will update both `package.json` and `package-lock.json` on its own branch.
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify E0-PR-001 architecture source
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest tests/re/test_architecture_boundaries.py tests/re/test_package_imports.py -q | tee /tmp/e0_pr_001_tests.log

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate frontend baseline
        id: frontend
        shell: bash
        run: |
          set +e
          cd web
          npm ci > /tmp/npm_ci.log 2>&1
          NPM_CI=$?
          if [ "$NPM_CI" -eq 0 ]; then
            npm run lint > /tmp/npm_lint.log 2>&1
            LINT=$?
            npm run build > /tmp/npm_build.log 2>&1
            BUILD=$?
          else
            LINT=125
            BUILD=125
            printf 'NOT RUN: npm ci failed\n' > /tmp/npm_lint.log
            printf 'NOT RUN: npm ci failed\n' > /tmp/npm_build.log
          fi
          cd ..
          echo "npm_ci=$NPM_CI" >> "$GITHUB_OUTPUT"
          echo "lint=$LINT" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write baseline evidence
        shell: bash
        run: |
          mkdir -p evidence
          {
            echo '# Application Source Baseline Validation'
            echo
            echo '**Date:** 2026-08-16'
            echo '**Reference:** `Reguluspt/New-project@cc6ad5fcc15703ae31fd9f2e8ee78c972f06d2ff:web/`'
            echo
            echo '## Results'
            echo '- E0-PR-001 architecture suite: PASS (workflow step completed)'
            echo '- npm ci exit: `${{ steps.frontend.outputs.npm_ci }}`'
            echo '- npm lint exit: `${{ steps.frontend.outputs.lint }}`'
            echo '- npm build exit: `${{ steps.frontend.outputs.build }}`'
            echo
            echo 'Exit 0 means PASS. Exit 125 means NOT RUN because npm ci failed.'
            echo
            echo '## npm ci log'
            echo '```text'
            cat /tmp/npm_ci.log
            echo '```'
            echo
            echo '## lint log'
            echo '```text'
            cat /tmp/npm_lint.log
            echo '```'
            echo
            echo '## build log'
            echo '```text'
            cat /tmp/npm_build.log
            echo '```'
          } > evidence/APPLICATION_SOURCE_BASELINE_VALIDATION_2026-08-16.md

      - name: Guard repository policy
        shell: bash
        run: |
          set -euo pipefail
          test -f web/package.json
          test -f web/package-lock.json
          test -f web/src/App.jsx
          test -d src/re
          test -d tests/re
          test ! -d web/node_modules
          git diff --check

      - name: Commit imported baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web src/re tests/re E0_PR_001_IMPLEMENTATION_REPORT.md APPLICATION_SOURCE_BASELINE.md evidence/APPLICATION_SOURCE_BASELINE_VALIDATION_2026-08-16.md
          git commit -m 'R1: materialize application source baseline'
          git push origin HEAD:agent/application-source-baseline
