name: E1-PR-005 Corrective Windows Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements-re.txt

      - name: Diff hygiene
        shell: pwsh
        run: git diff --check f14018b19afcdb1cf600f46524e18f8ea2d3f4de..HEAD

      - name: Compile RE source
        shell: pwsh
        run: python -m compileall -q src/re

      - name: Full RE regression
        shell: pwsh
        run: python -m pytest -q tests/re

      - name: Focused E1-PR-005 corrective proof
        shell: pwsh
        run: python -m pytest -q tests/re/test_workbook_output_profile.py tests/re/test_workbook_output_source_evidence.py tests/re/test_workbook_output_writer.py tests/re/test_workbook_output_service.py tests/re/test_workbook_output_publication_corrective.py tests/re/test_architecture_boundaries.py
