name: E1-PR-004 Windows Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest Flask==3.1.1 sqlcipher3==0.6.2 pywin32==312

      - name: Diff hygiene
        shell: pwsh
        run: git diff --check eef0a9111f1977a49bad11ace2089d9c73ca5772..HEAD

      - name: Compile RE source
        shell: pwsh
        run: python -m compileall -q src/re

      - name: Full RE regression
        shell: pwsh
        run: python -m pytest -q tests/re

      - name: Focused E1-PR-004 proof
        shell: pwsh
        run: python -m pytest -q tests/re/test_final_valuation_domain.py tests/re/test_final_valuation_service.py tests/re/test_final_valuation_currentness.py
