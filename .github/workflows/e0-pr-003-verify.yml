name: E0-PR-003 Decimal and RoundingPolicy verification

on:
  push:
    branches:
      - agent/e0-pr-003-decimal-rounding
    paths:
      - .github/workflows/e0-pr-003-verify.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/e0-pr-003-decimal-rounding
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Capture exact tested head
        run: |
          echo "TESTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python --version

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile domain primitives
        run: python -m compileall -q src/re/domain/common

      - name: Verify bounded scope
        run: |
          python - <<'PY'
          import subprocess

          base = 'd89334c4c0ba5a666d4ce5556bc665d6e74750c0'
          allowed = {
              '.github/workflows/e0-pr-003-verify.yml',
              'src/re/domain/common/__init__.py',
              'src/re/domain/common/numeric.py',
              'src/re/domain/common/rounding.py',
              'tests/re/test_numeric_primitives.py',
              'tests/re/test_rounding_policy.py',
          }
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', f'{base}...HEAD'], text=True
              ).splitlines()
          )
          unexpected = sorted(changed - allowed)
          missing = sorted(
              {
                  'src/re/domain/common/numeric.py',
                  'src/re/domain/common/rounding.py',
                  'tests/re/test_numeric_primitives.py',
                  'tests/re/test_rounding_policy.py',
              }
              - changed
          )
          print('changed files:')
          for path in sorted(changed):
              print('-', path)
          if unexpected:
              raise SystemExit('Unexpected E0-PR-003 scope: ' + ', '.join(unexpected))
          if missing:
              raise SystemExit('Missing E0-PR-003 files: ' + ', '.join(missing))
          PY
          git diff --check d89334c4c0ba5a666d4ce5556bc665d6e74750c0...HEAD

      - name: Run E0-PR-003 and architecture regression tests
        run: |
          set -euo pipefail
          python -m pytest \
            tests/re/test_architecture_boundaries.py \
            tests/re/test_package_imports.py \
            tests/re/test_numeric_primitives.py \
            tests/re/test_rounding_policy.py \
            -q | tee /tmp/e0-pr-003-tests.log

      - name: Write evidence
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > evidence/E0_PR_003_RUNTIME_EVIDENCE_v1.md <<EOF
          # E0-PR-003 — Decimal + RoundingPolicy Runtime Evidence v1

          **Date:** 2026-08-16  
          **Repository:** \`Reguluspt/CEN-Value-RE\`  
          **Implementation baseline:** \`d89334c4c0ba5a666d4ce5556bc665d6e74750c0\`  
          **Tested HEAD:** \`${TESTED_HEAD}\`  
          **GitHub Actions run:** \`${GITHUB_RUN_ID}\`  
          **Python:** 3.11

          ## Verification
          - domain common package compiles: PASS
          - bounded scope / \`git diff --check\`: PASS
          - existing RE architecture/import regression suite: PASS
          - Decimal numeric primitives: PASS
          - binary-float rejection + AST float guard: PASS
          - Percentage canonical fraction (5% = 0.05): PASS
          - RoundingPolicy NONE/1k/10k/100k/1m/10m/custom: PASS
          - Excel-compatible nearest half-away-from-zero behavior: PASS
          - case override -> template default -> application default resolver: PASS
          - explicit NONE case override preserved: PASS
          - raw/rounded values kept separately in immutable result: PASS
          - custom future rounding target supported without closed enum: PASS
          - external Decimal context precision does not change rounding result: PASS
          - N08 unit-price default: 196,308,350 -> 196,308,000: PASS
          - N08 final total default: 19,581,412,440 -> 19,581,000,000: PASS

          ## Scope
          No valuation formula engine, Excel adapter/profile implementation, persistence, API, UI, OCR/provider, or Epic 1 feature is introduced.

          ## Acceptance
          Implementation evidence only. E0-PR-003 remains pending independent review/acceptance.
          EOF
          cp /tmp/e0-pr-003-tests.log evidence/E0-PR-003_tests_v1.log

      - name: Commit evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/E0_PR_003_RUNTIME_EVIDENCE_v1.md evidence/E0-PR-003_tests_v1.log
          git commit -m 'E0-PR-003: record runtime evidence v1'
          git push origin HEAD:agent/e0-pr-003-decimal-rounding
