name: E1-PR-005 Package Determinism Hotfix Verification

on:
  push:
    branches:
      - agent/e1-pr-005-deterministic-package-hotfix
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements-re.txt

      - name: Diff hygiene
        shell: pwsh
        run: git diff --check be537e573d6692c6cbfaf5a6cb3710ad7c229177..HEAD

      - name: Compile RE source
        shell: pwsh
        run: python -m compileall -q src/re

      - name: Full RE regression
        shell: pwsh
        run: python -m pytest -q tests/re

      - name: Focused package determinism proof
        shell: pwsh
        run: python -m pytest -q tests/re/test_workbook_output_writer.py tests/re/test_workbook_output_publication_corrective.py tests/re/test_workbook_output_package_determinism_hotfix.py
