name: E1-PR-003 Windows Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest Flask==3.1.1 sqlcipher3==0.6.2 pywin32==312

      - name: Diff hygiene
        shell: pwsh
        run: git diff --check 7e60be157e6b0d5300ffaa8dabac1aadc73f96fb..HEAD

      - name: Compile RE source
        shell: pwsh
        run: python -m compileall -q src/re

      - name: Full RE regression
        shell: pwsh
        run: python -m pytest -q tests/re

      - name: Focused E1-PR-003 proof
        shell: pwsh
        run: python -m pytest -q tests/re/test_comparable_quality_domain.py tests/re/test_comparable_quality_service.py
