name: E0-PR-005 Golden Fixture Harness verification

on:
  push:
    branches: [agent/e0-pr-005-golden-fixture]
    paths: [.github/workflows/e0-pr-005-verify.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/e0-pr-005-golden-fixture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture exact tested head
        run: |
          echo "TESTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python --version
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile harness
        run: python -m compileall -q src/re/application/services
      - name: Verify bounded scope
        run: |
          python - <<'PY'
          import subprocess
          base = 'fc00998b6f5230aec9c15e4dbba64c88a1418137'
          allowed = {
              '.github/workflows/e0-pr-005-verify.yml',
              'fixtures/GOLDEN_CASE_CHECKPOINT_MANIFEST_v1.json',
              'src/re/application/services/__init__.py',
              'src/re/application/services/golden_fixture.py',
              'tests/re/test_golden_fixture_harness.py',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only',f'{base}...HEAD'], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          required = allowed - {'.github/workflows/e0-pr-005-verify.yml'}
          missing = sorted(required - changed)
          print('changed files:')
          for path in sorted(changed): print('-', path)
          if unexpected: raise SystemExit('Unexpected E0-PR-005 scope: ' + ', '.join(unexpected))
          if missing: raise SystemExit('Missing E0-PR-005 files: ' + ', '.join(missing))
          PY
          git diff --check fc00998b6f5230aec9c15e4dbba64c88a1418137...HEAD
      - name: Run E0-PR-005 and foundation regressions
        run: |
          set -euo pipefail
          python -m pytest \
            tests/re/test_architecture_boundaries.py \
            tests/re/test_package_imports.py \
            tests/re/test_numeric_primitives.py \
            tests/re/test_rounding_policy.py \
            tests/re/test_excel_template_profile.py \
            tests/re/test_golden_fixture_harness.py \
            -q | tee /tmp/e0-pr-005-tests.log
      - name: Capture harness vectors
        run: |
          python - <<'PY' | tee /tmp/e0-pr-005-vectors.log
          from src.re.application.services.golden_fixture import load_golden_bundle, evaluate_checkpoint_results
          bundle = load_golden_bundle('fixtures/GOLDEN_CASE_CANONICAL_FIXTURE_v1.json','fixtures/GOLDEN_CASE_CHECKPOINT_MANIFEST_v1.json')
          oracle = {item.checkpoint_id: item.expected for item in bundle.manifest.checkpoints}
          passed = evaluate_checkpoint_results(bundle.manifest, oracle)
          mutated = dict(oracle); mutated['Bangtinh!G182'] = '19582000000'
          rejected = evaluate_checkpoint_results(bundle.manifest, mutated)
          failed = [x.checkpoint_id for x in rejected.outcomes if not x.passed]
          print('fixture_id=' + bundle.fixture.fixture_id)
          print('fixture_status=' + bundle.fixture.status)
          print('fixture_partial_input_coverage=' + str(bundle.fixture.partial_input_coverage).lower())
          print('fixture_semantic_sha256=' + bundle.fixture.semantic_sha256)
          print('manifest_id=' + bundle.manifest.manifest_id)
          print('manifest_version=' + str(bundle.manifest.version))
          print('manifest_semantic_sha256=' + bundle.manifest.semantic_sha256)
          print('checkpoint_count=' + str(len(bundle.manifest.checkpoints)))
          print('checkpoint_set_sha256=' + bundle.manifest.checkpoint_set_sha256)
          print('oracle_supplied_map_pass=' + str(passed.passed).lower())
          print('g182_mutation_pass=' + str(rejected.passed).lower())
          print('g182_mutation_failed_ids=' + ','.join(failed))
          assert bundle.fixture.partial_input_coverage
          assert len(bundle.manifest.checkpoints) == 31
          assert passed.passed
          assert not rejected.passed
          assert failed == ['Bangtinh!G182']
          PY
      - name: Write evidence
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > evidence/E0_PR_005_RUNTIME_EVIDENCE_v1.md <<EOF
          # E0-PR-005 — Golden Fixture Harness Runtime Evidence v1

          **Date:** 2026-08-16
          **Repository:** \`Reguluspt/CEN-Value-RE\`
          **Implementation baseline:** \`fc00998b6f5230aec9c15e4dbba64c88a1418137\`
          **Tested HEAD:** \`${TESTED_HEAD}\`
          **GitHub Actions run:** \`${GITHUB_RUN_ID}\`
          **Python:** 3.11

          ## Verification
          - harness compile: PASS
          - bounded scope / git diff check: PASS
          - architecture/import regressions: PASS
          - E0-PR-003 Decimal/RoundingPolicy regressions: PASS
          - E0-PR-004 ExcelTemplateProfile/Fingerprint regressions: PASS
          - Golden Fixture Harness focused tests: PASS
          - canonical fixture loads deterministically: PASS
          - versioned 31-checkpoint manifest loads deterministically: PASS
          - fixture-to-manifest expected-value bindings: PASS
          - per-checkpoint Decimal/tolerance policies: PASS
          - strict missing/unexpected checkpoint behavior: PASS
          - binary-float/non-finite result rejection: PASS
          - supplied oracle map comparison: PASS
          - deliberate G182 mutation rejected: PASS
          - fixture remains PARTIAL INPUT COVERAGE: CONFIRMED

          ## Scope qualification
          This is comparator/harness evidence only. It does not execute valuation formulas, fill/recalculate Excel, or claim GF-01/GF-02 end-to-end qualification.

          ## Acceptance
          Implementation evidence only. E0-PR-005 remains pending independent review/acceptance.
          EOF
          cp /tmp/e0-pr-005-tests.log evidence/E0-PR-005_tests_v1.log
          cp /tmp/e0-pr-005-vectors.log evidence/E0-PR-005_harness_vectors_v1.log
      - name: Commit evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/E0_PR_005_RUNTIME_EVIDENCE_v1.md evidence/E0-PR-005_tests_v1.log evidence/E0-PR-005_harness_vectors_v1.log
          git commit -m 'E0-PR-005: record runtime evidence v1'
          git push origin HEAD:agent/e0-pr-005-golden-fixture
