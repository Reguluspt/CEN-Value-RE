name: E0-PR-004 ExcelTemplateProfile verification

on:
  push:
    branches:
      - agent/e0-pr-004-excel-profile
    paths:
      - .github/workflows/e0-pr-004-verify.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/e0-pr-004-excel-profile
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Capture exact tested head
        run: |
          echo "TESTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python --version

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile Excel profile infrastructure
        run: python -m compileall -q src/re/adapters/excel

      - name: Verify bounded scope
        run: |
          python - <<'PY'
          import subprocess

          base = 'eb8144b47576bf847c618bf13836aff7a9e7d37c'
          allowed = {
              '.github/workflows/e0-pr-004-verify.yml',
              'src/re/adapters/excel/__init__.py',
              'src/re/adapters/excel/profile.py',
              'src/re/adapters/excel/fingerprint.py',
              'src/re/adapters/excel/n08_0038.py',
              'tests/re/test_excel_template_profile.py',
          }
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', f'{base}...HEAD'], text=True
              ).splitlines()
          )
          unexpected = sorted(changed - allowed)
          required = {
              'src/re/adapters/excel/profile.py',
              'src/re/adapters/excel/fingerprint.py',
              'src/re/adapters/excel/n08_0038.py',
              'tests/re/test_excel_template_profile.py',
          }
          missing = sorted(required - changed)
          print('changed files:')
          for path in sorted(changed):
              print('-', path)
          if unexpected:
              raise SystemExit('Unexpected E0-PR-004 scope: ' + ', '.join(unexpected))
          if missing:
              raise SystemExit('Missing E0-PR-004 files: ' + ', '.join(missing))
          PY
          git diff --check eb8144b47576bf847c618bf13836aff7a9e7d37c...HEAD

      - name: Run E0-PR-004 and foundation regression tests
        run: |
          set -euo pipefail
          python -m pytest \
            tests/re/test_architecture_boundaries.py \
            tests/re/test_package_imports.py \
            tests/re/test_numeric_primitives.py \
            tests/re/test_rounding_policy.py \
            tests/re/test_excel_template_profile.py \
            -q | tee /tmp/e0-pr-004-tests.log

      - name: Capture fingerprint vectors
        run: |
          python - <<'PY' | tee /tmp/e0-pr-004-vectors.log
          from dataclasses import replace
          from src.re.adapters.excel import (
              ExternalLinkState,
              FormulaObservation,
              N08_0038_PROFILE,
              SheetObservation,
              WorkbookFingerprintObservation,
              match_template_profile,
          )

          exemplar = WorkbookFingerprintObservation(
              sheets=tuple(
                  SheetObservation(item.name, item.state)
                  for item in N08_0038_PROFILE.required_sheets
              ),
              formulas=tuple(
                  FormulaObservation(item.cell, item.formula)
                  for item in N08_0038_PROFILE.formula_signatures
              ),
              external_link_state=ExternalLinkState.KNOWN_STALE_SELF_REFERENCE,
              filename=N08_0038_PROFILE.source_exemplar,
          )
          matched = match_template_profile(N08_0038_PROFILE, exemplar)
          mutated = replace(
              exemplar,
              formulas=tuple(
                  FormulaObservation(
                      item.cell,
                      '=ROUND(Sheet1!G18,-4)'
                      if item.cell == 'Bangtinh!H119'
                      else item.formula,
                  )
                  for item in exemplar.formulas
              ),
          )
          rejected = match_template_profile(N08_0038_PROFILE, mutated)

          print('profile_id=' + matched.profile_id)
          print('exemplar_status=' + matched.status.value)
          print('exemplar_warnings=' + ','.join(issue.code for issue in matched.warnings))
          print('sheet_digest=' + matched.profile_sheet_digest)
          print('formula_digest=' + matched.profile_formula_digest)
          print('mutation_status=' + rejected.status.value)
          print('mutation_errors=' + ','.join(issue.code for issue in rejected.errors))

          assert matched.supported
          assert not matched.errors
          assert not rejected.supported
          assert any(
              issue.code == 'FORMULA_SIGNATURE_MISMATCH'
              for issue in rejected.errors
          )
          PY

      - name: Write evidence
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > evidence/E0_PR_004_RUNTIME_EVIDENCE_v1.md <<EOF
          # E0-PR-004 — ExcelTemplateProfile + Fingerprint Runtime Evidence v1

          **Date:** 2026-08-16
          **Repository:** \`Reguluspt/CEN-Value-RE\`
          **Implementation baseline:** \`eb8144b47576bf847c618bf13836aff7a9e7d37c\`
          **Tested HEAD:** \`${TESTED_HEAD}\`
          **GitHub Actions run:** \`${GITHUB_RUN_ID}\`
          **Python:** 3.11

          ## Verification
          - Excel profile infrastructure compiles: PASS
          - bounded scope / git diff check: PASS
          - existing architecture/import regressions: PASS
          - E0-PR-003 Decimal/RoundingPolicy regressions: PASS
          - N08-0038 profile schema and frozen 16-sheet/24-formula data: PASS
          - normalized formula signatures and deterministic digests: PASS
          - exemplar structural observation: MATCHED
          - renamed filename remains metadata warning, not identity: PASS
          - missing/mutated formula, sheet/state mutation and extra sheet fail closed: PASS
          - undeclared external-link state fail closed: PASS
          - known stale external reference classified as allowed warning: PASS
          - compatibility metadata alone cannot bypass a formula mismatch: PASS
          - only an exact declared alternate formula can use transformation exception: PASS
          - unknown cell class defaults to UNKNOWN/read-only safety class: PASS
          - deliberate Bangtinh!H119 -3 to -4 mutation: UNSUPPORTED_TEMPLATE
          - no openpyxl/COM/xlwings/pandas runtime dependency in E0-PR-004 infrastructure: PASS

          ## Scope
          No workbook fill/write implementation, Excel recalculation runtime, Golden Fixture Harness, valuation formula, persistence, API, UI or provider implementation is introduced.

          ## Acceptance
          Implementation evidence only. E0-PR-004 remains pending independent review/acceptance.
          EOF
          cp /tmp/e0-pr-004-tests.log evidence/E0-PR-004_tests_v1.log
          cp /tmp/e0-pr-004-vectors.log evidence/E0-PR-004_fingerprint_vectors_v1.log

      - name: Commit evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evidence/E0_PR_004_RUNTIME_EVIDENCE_v1.md \
            evidence/E0-PR-004_tests_v1.log \
            evidence/E0-PR-004_fingerprint_vectors_v1.log
          git commit -m 'E0-PR-004: record runtime evidence v1'
          git push origin HEAD:agent/e0-pr-004-excel-profile
