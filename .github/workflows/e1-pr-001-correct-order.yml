name: E1-PR-001 correct deterministic child ordering

on:
  push:
    branches:
      - agent/e1-pr-001-manual-data-backbone
    paths:
      - .github/workflows/e1-pr-001-correct-order.yml

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/e1-pr-001-manual-data-backbone
          fetch-depth: 0

      - name: Apply deterministic ordinal correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_s: str, old: str, new: str) -> None:
              path = Path(path_s)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'src/re/ports/persistence.py',
              '''class LandParcelRecord:\n    id: str\n    property_id: str\n    created_at: str\n    updated_at: str\n''',
              '''class LandParcelRecord:\n    id: str\n    property_id: str\n    parcel_order: int\n    created_at: str\n    updated_at: str\n''',
          )
          replace_once(
              'src/re/ports/persistence.py',
              '''class LandValuationComponentRecord:\n    id: str\n    property_id: str\n    planning_status: str\n''',
              '''class LandValuationComponentRecord:\n    id: str\n    property_id: str\n    component_order: int\n    planning_status: str\n''',
          )
          replace_once(
              'src/re/ports/persistence.py',
              '''class EvidenceRecord:\n    id: str\n    property_id: str\n    created_at: str\n''',
              '''class EvidenceRecord:\n    id: str\n    property_id: str\n    evidence_order: int\n    created_at: str\n''',
          )

          replace_once(
              'src/re/adapters/persistence/migrations.py',
              '''                property_id TEXT NOT NULL REFERENCES property(id),\n                parcel_number TEXT,\n''',
              '''                property_id TEXT NOT NULL REFERENCES property(id),\n                parcel_order INTEGER NOT NULL CHECK (parcel_order > 0),\n                parcel_number TEXT,\n''',
          )
          replace_once(
              'src/re/adapters/persistence/migrations.py',
              '''                updated_at TEXT NOT NULL,\n                archived_at TEXT\n            )\"\"\",\n            \"\"\"CREATE TABLE land_valuation_component (\n''',
              '''                updated_at TEXT NOT NULL,\n                archived_at TEXT,\n                UNIQUE(property_id, parcel_order)\n            )\"\"\",\n            \"\"\"CREATE TABLE land_valuation_component (\n''',
          )
          replace_once(
              'src/re/adapters/persistence/migrations.py',
              '''                property_id TEXT NOT NULL REFERENCES property(id),\n                parcel_id TEXT REFERENCES land_parcel(id),\n                planning_status TEXT NOT NULL CHECK (planning_status IN ('COMPLIANT','NON_COMPLIANT','UNKNOWN')),\n''',
              '''                property_id TEXT NOT NULL REFERENCES property(id),\n                parcel_id TEXT REFERENCES land_parcel(id),\n                component_order INTEGER NOT NULL CHECK (component_order > 0),\n                planning_status TEXT NOT NULL CHECK (planning_status IN ('COMPLIANT','NON_COMPLIANT','UNKNOWN')),\n''',
          )
          replace_once(
              'src/re/adapters/persistence/migrations.py',
              '''                updated_at TEXT NOT NULL,\n                archived_at TEXT\n            )\"\"\",\n            \"\"\"CREATE TABLE property_characteristic (\n''',
              '''                updated_at TEXT NOT NULL,\n                archived_at TEXT,\n                UNIQUE(parcel_id, component_order)\n            )\"\"\",\n            \"\"\"CREATE TABLE property_characteristic (\n''',
          )
          replace_once(
              'src/re/adapters/persistence/migrations.py',
              '''                property_id TEXT NOT NULL REFERENCES property(id),\n                market_observation_id TEXT REFERENCES market_observation(id),\n                evidence_type TEXT,\n''',
              '''                property_id TEXT NOT NULL REFERENCES property(id),\n                market_observation_id TEXT REFERENCES market_observation(id),\n                evidence_order INTEGER NOT NULL CHECK (evidence_order > 0),\n                evidence_type TEXT,\n''',
          )
          replace_once(
              'src/re/adapters/persistence/migrations.py',
              '''                updated_at TEXT NOT NULL,\n                archived_at TEXT\n            )\"\"\",\n            \"CREATE UNIQUE INDEX uq_property_case_role_subject''',
              '''                updated_at TEXT NOT NULL,\n                archived_at TEXT,\n                UNIQUE(property_id, evidence_order)\n            )\"\"\",\n            \"CREATE UNIQUE INDEX uq_property_case_role_subject''',
          )

          replace_once(
              'src/re/adapters/persistence/repositories.py',
              '''            \"SELECT * FROM land_parcel WHERE property_id=? ORDER BY created_at,id\", (property_id,)\n''',
              '''            \"SELECT * FROM land_parcel WHERE property_id=? ORDER BY parcel_order,id\", (property_id,)\n''',
          )
          replace_once(
              'src/re/adapters/persistence/repositories.py',
              '''        rows = self._connection.execute(\n            \"SELECT * FROM land_valuation_component WHERE property_id=? ORDER BY created_at,id\", (property_id,)\n        ).fetchall()\n''',
              '''        rows = self._connection.execute(\n            \"\"\"SELECT c.* FROM land_valuation_component c\n            LEFT JOIN land_parcel p ON p.id=c.parcel_id\n            WHERE c.property_id=?\n            ORDER BY COALESCE(p.parcel_order, 2147483647), c.component_order, c.id\"\"\",\n            (property_id,),\n        ).fetchall()\n''',
          )
          replace_once(
              'src/re/adapters/persistence/repositories.py',
              '''            \"SELECT * FROM evidence WHERE property_id=? ORDER BY created_at,id\", (property_id,)\n''',
              '''            \"SELECT * FROM evidence WHERE property_id=? ORDER BY evidence_order,id\", (property_id,)\n''',
          )

          replace_once(
              'src/re/application/services/manual_case.py',
              '''                    id=parcel_id,\n                    property_id=property_id,\n                    created_at=existing_parcel.created_at if existing_parcel else timestamp,\n''',
              '''                    id=parcel_id,\n                    property_id=property_id,\n                    parcel_order=index + 1,\n                    created_at=existing_parcel.created_at if existing_parcel else timestamp,\n''',
          )
          replace_once(
              'src/re/application/services/manual_case.py',
              '''                        id=existing_component.id if existing_component else self._new_id(),\n                        property_id=property_id,\n                        parcel_id=parcel_id,\n                        planning_status=component.planning_status,\n''',
              '''                        id=existing_component.id if existing_component else self._new_id(),\n                        property_id=property_id,\n                        parcel_id=parcel_id,\n                        component_order=component_index + 1,\n                        planning_status=component.planning_status,\n''',
          )
          replace_once(
              'src/re/application/services/manual_case.py',
              '''                    id=existing_item.id if existing_item else self._new_id(),\n                    property_id=property_id,\n                    market_observation_id=observation_id,\n                    created_at=existing_item.created_at if existing_item else timestamp,\n''',
              '''                    id=existing_item.id if existing_item else self._new_id(),\n                    property_id=property_id,\n                    evidence_order=index + 1,\n                    market_observation_id=observation_id,\n                    created_at=existing_item.created_at if existing_item else timestamp,\n''',
          )

          replace_once(
              'tests/re/test_manual_case_data_backbone.py',
              '''                        ),\n                    ),\n                ),\n                characteristics=(\n''',
              '''                        ),\n                    ),\n                    LandParcelInput(\n                        parcel_number=\"25\",\n                        map_sheet_number=\"29/BĐĐC\",\n                        total_area_m2=\"1.00\",\n                    ),\n                ),\n                characteristics=(\n''',
          )
          replace_once(
              'tests/re/test_manual_case_data_backbone.py',
              '''        assert subject.subject.parcels[0].total_area_m2 == \"103.20\"\n        assert subject.subject.land_valuation_components[0].area_m2 == \"82.9300\"\n''',
              '''        assert [item.parcel_number for item in subject.subject.parcels] == [\"24\", \"25\"]\n        assert subject.subject.parcels[0].total_area_m2 == \"103.20\"\n        assert [item.component_order for item in subject.subject.land_valuation_components] == [1, 2]\n        assert subject.subject.land_valuation_components[0].area_m2 == \"82.9300\"\n''',
          )
          replace_once(
              'tests/re/test_manual_case_data_backbone.py',
              '''            EvidenceInput(\n                evidence_type=\"MANUAL_MARKET_NOTE\",\n                source_url=f\"https://example.invalid/tsss-{slot}\",\n                note=f\"manual evidence {slot}\",\n            ),\n        ),\n''',
              '''            EvidenceInput(\n                evidence_type=\"MANUAL_MARKET_NOTE\",\n                source_url=f\"https://example.invalid/tsss-{slot}\",\n                note=f\"manual evidence {slot}\",\n            ),\n            EvidenceInput(\n                evidence_type=\"MANUAL_MARKET_NOTE\",\n                source_url=f\"https://example.invalid/tsss-{slot}-secondary\",\n                note=f\"manual evidence {slot} secondary\",\n            ),\n        ),\n''',
          )
          replace_once(
              'tests/re/test_manual_case_data_backbone.py',
              '''        assert resumed.comparables[1].market_observation is not None\n        assert resumed.comparables[1].market_observation.negotiation_rate_pct is None\n        before_close_json = resumed.to_json()\n''',
              '''        assert resumed.comparables[1].market_observation is not None\n        assert resumed.comparables[1].market_observation.negotiation_rate_pct is None\n        assert [item.evidence_order for item in resumed.comparables[0].evidence] == [1, 2]\n        assert [item.note for item in resumed.comparables[0].evidence] == [\n            \"manual evidence 1\",\n            \"manual evidence 1 secondary\",\n        ]\n        before_close_json = resumed.to_json()\n''',
          )
          replace_once(
              'tests/re/test_manual_case_data_backbone.py',
              '''        \"property_characteristic\",\n        \"land_parcel\",\n        \"land_valuation_component\",\n        \"market_observation\",\n        \"evidence\",\n''',
              '''        \"property_characteristic\",\n        \"land_parcel\",\n        \"parcel_order\",\n        \"land_valuation_component\",\n        \"component_order\",\n        \"market_observation\",\n        \"evidence\",\n        \"evidence_order\",\n''',
          )
          PY

      - name: Remove corrective workflow and validate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/e1-pr-001-correct-order.yml
          python -m compileall -q src/re tests/re/test_manual_case_data_backbone.py
          git diff --check
          git status --short

      - name: Commit corrective implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'E1-PR-001: persist deterministic child ordering'
          git push origin HEAD:agent/e1-pr-001-manual-data-backbone
