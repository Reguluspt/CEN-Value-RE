name: E1-PR-006 Windows Verification

on:
  push:
    branches:
      - agent/e1-pr-006-local-service-astryx-workbench
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python runtime test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements-re.txt

      - name: Diff hygiene
        shell: pwsh
        run: git diff --check f68ce4c62280b2859b7db0e8f0fc75b52374bb67..HEAD

      - name: Compile RE source
        shell: pwsh
        run: python -m compileall -q src/re

      - name: Full RE regression
        shell: pwsh
        run: python -m pytest -q tests/re

      - name: Focused E1-PR-006 backend proof
        shell: pwsh
        run: python -m pytest -q tests/re/test_manual_workbench_integration.py tests/re/test_manual_workbench_live_runtime.py tests/re/test_manual_case_data_backbone.py tests/re/test_local_service_boundary.py tests/re/test_architecture_boundaries.py

      - name: Install frontend dependencies
        working-directory: web
        shell: pwsh
        run: npm ci

      - name: Verify Astryx isolation and workbench boundaries
        working-directory: web
        shell: pwsh
        run: |
          npm run verify:re-astryx
          node scripts/verify-re-workbench-boundaries.mjs

      - name: Browser-level E1-PR-006 vertical smoke
        working-directory: web
        shell: pwsh
        run: |
          node --check scripts/verify-re-workbench-browser-smoke.mjs
          node scripts/verify-re-workbench-browser-smoke.mjs

      - name: Verify frontend change scope
        shell: pwsh
        run: |
          $outside = git diff --name-only f68ce4c62280b2859b7db0e8f0fc75b52374bb67..HEAD -- web/src | Where-Object { $_ -notlike 'web/src/re/*' }
          if ($outside) {
            Write-Error ("E1-PR-006 changed legacy frontend source outside web/src/re:`n" + ($outside -join "`n"))
            exit 1
          }

      - name: Scoped E1-PR-006 frontend lint
        working-directory: web
        shell: pwsh
        run: npx eslint src/re/ReShell.jsx src/re/localServiceClient.js src/re/percent.js src/re/workbenchApi.js src/re/smokeHarness.jsx

      - name: Observe inherited full frontend lint baseline
        continue-on-error: true
        working-directory: web
        shell: pwsh
        run: npm run lint

      - name: Frontend production build
        working-directory: web
        shell: pwsh
        run: npm run build
