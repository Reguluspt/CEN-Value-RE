name: E0-PR-002 materialize and verify

on:
  push:
    branches:
      - agent/e0-pr-002-astryx
    paths:
      - .github/workflows/e0-pr-002-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CenValue RE branch
        uses: actions/checkout@v4
        with:
          ref: agent/e0-pr-002-astryx
          fetch-depth: 0

      - name: Set up Node 22.13
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Capture legacy lint baseline
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm ci
          npx eslint . -f json > /tmp/baseline-eslint.json || true
          cd ..

      - name: Apply E0-PR-002 patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check implementation/E0-PR-002_ASTRYX_SPIKE_v1.patch
          git apply implementation/E0-PR-002_ASTRYX_SPIKE_v1.patch
          git diff --check

      - name: Update lockfile with exact Astryx dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm install --save-exact \
            @astryxdesign/core@0.2.0 \
            @astryxdesign/theme-neutral@0.2.0 \
            @stylexjs/stylex@0.19.0
          cd ..

      - name: Verify static Astryx boundary
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm run verify:re-astryx | tee /tmp/astryx-static.log
          cd ..

      - name: Scoped lint for E0-PR-002 files
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npx eslint src/App.jsx src/re/ReShell.jsx scripts/verify-re-astryx-spike.mjs | tee /tmp/astryx-scoped-lint.log
          cd ..

      - name: Full lint non-regression
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npx eslint . -f json > /tmp/after-eslint.json || true
          python - <<'PY'
          import json, os

          root = os.getcwd()
          changed = {
              'src/App.jsx',
              'src/re/ReShell.jsx',
              'scripts/verify-re-astryx-spike.mjs',
          }

          def load(path):
              data = json.load(open(path, encoding='utf-8'))
              result = {}
              for entry in data:
                  rel = os.path.relpath(entry['filePath'], root).replace('\\', '/')
                  msgs = []
                  for m in entry.get('messages', []):
                      msgs.append((m.get('severity'), m.get('ruleId'), m.get('message'), m.get('line'), m.get('column')))
                  result[rel] = sorted(msgs, key=lambda x: tuple('' if v is None else str(v) for v in x))
              return result

          before = load('/tmp/baseline-eslint.json')
          after = load('/tmp/after-eslint.json')
          regressions = []
          for path in sorted(set(before) | set(after)):
              if path in changed:
                  continue
              if before.get(path, []) != after.get(path, []):
                  regressions.append(path)

          before_errors = sum(1 for msgs in before.values() for m in msgs if m[0] == 2)
          after_errors = sum(1 for msgs in after.values() for m in msgs if m[0] == 2)
          summary = {
              'baseline_error_count': before_errors,
              'after_error_count': after_errors,
              'unchanged_file_regressions': regressions,
          }
          json.dump(summary, open('/tmp/lint-summary.json', 'w'), indent=2)
          if regressions:
              raise SystemExit('Full lint regression in unchanged files: ' + ', '.join(regressions))
          print(json.dumps(summary, indent=2))
          PY
          cd ..

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm run build | tee /tmp/astryx-build.log
          cd ..

      - name: Browser smoke and CSS isolation
        shell: bash
        run: |
          set -euo pipefail
          cd web
          sha256sum package.json package-lock.json > /tmp/package-hashes-before-playwright.txt
          npm install --no-save --package-lock=false playwright@1.54.2
          sha256sum package.json package-lock.json > /tmp/package-hashes-after-playwright.txt
          diff -u /tmp/package-hashes-before-playwright.txt /tmp/package-hashes-after-playwright.txt
          npx playwright install --with-deps chromium

          npm run dev -- --host 127.0.0.1 > /tmp/vite-e0-pr-002.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done

          cat > /tmp/e0-pr-002-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
          const page = await context.newPage();
          const pageErrors = [];
          page.on('pageerror', error => pageErrors.push(String(error)));

          await page.route('**/api/**', async route => {
            const path = new URL(route.request().url()).pathname;
            let body = {};
            if (path === '/api/auth/me') {
              body = { user: { id: 1, username: 'admin', role: 'admin' } };
            } else if (path === '/api/dashboard/stats') {
              body = {
                selected_month: '', available_months: [], monthly_revenue: [], daily_revenue: [],
                bank_revenue: [], unpaid_cases: [], year_paid: 0, year_unpaid: 0,
                unpaid_total: 0, unpaid_count: 0, total_cases: 0, total_revenue: 0,
                total_paid: 0, total_unpaid: 0
              };
            } else if (path === '/api/dashboard/recent-cases') {
              body = [];
            } else if (path === '/api/dashboard/filters') {
              body = { years: ['2026'], branches: [], staff_names: [], statuses: [], customer_types: [] };
            } else if (path === '/api/cases/filters') {
              body = { statuses: [], branches: [], staff_names: [], customer_types: [] };
            } else if (path === '/api/cases') {
              body = { items: [], total: 0 };
            }
            await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(body) });
          });

          async function goto(path, text) {
            await page.goto(`http://127.0.0.1:5173${path}`, { waitUntil: 'networkidle' });
            await page.getByText(text, { exact: false }).first().waitFor({ state: 'visible' });
            await page.waitForTimeout(250);
          }

          async function styleSnapshot(path, text, selector) {
            await goto(path, text);
            return page.evaluate((sel) => {
              const body = getComputedStyle(document.body);
              const el = document.querySelector(sel);
              const target = el ? getComputedStyle(el) : null;
              return {
                bodyFontFamily: body.fontFamily,
                bodyFontSize: body.fontSize,
                bodyMargin: body.margin,
                bodyBackground: body.backgroundColor,
                targetFontFamily: target?.fontFamily ?? null,
                targetFontSize: target?.fontSize ?? null,
                targetColor: target?.color ?? null,
                targetBorderRadius: target?.borderRadius ?? null,
              };
            }, selector);
          }

          const dashboardBefore = await styleSnapshot('/dashboard', 'Dashboard', 'h1');
          const casesBefore = await styleSnapshot('/cases', 'Quản lý hồ sơ', '.ant-card');

          await goto('/re', 'CenValue RE — Astryx integration spike');
          await page.locator('[data-re-astryx-spike="v1"]').waitFor({ state: 'visible' });
          assert.equal(await page.locator('[data-re-astryx-spike="v1"] input').count(), 2);

          const dashboardAfter = await styleSnapshot('/dashboard', 'Dashboard', 'h1');
          const casesAfter = await styleSnapshot('/cases', 'Quản lý hồ sơ', '.ant-card');
          assert.deepEqual(dashboardAfter, dashboardBefore, 'Dashboard computed styles changed after visiting /re');
          assert.deepEqual(casesAfter, casesBefore, 'Cases computed styles changed after visiting /re');
          assert.deepEqual(pageErrors, [], 'Browser page errors: ' + pageErrors.join(' | '));

          console.log('E0-PR-002 browser smoke PASSED');
          console.log('- /re rendered as mocked admin');
          console.log('- two Astryx TextInput controls rendered');
          console.log('- /dashboard computed styles unchanged after /re');
          console.log('- /cases computed styles unchanged after /re');
          await browser.close();
          JS

          node /tmp/e0-pr-002-smoke.mjs | tee /tmp/astryx-browser-smoke.log
          cd ..

      - name: Write E0-PR-002 execution evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          BASE_ERRORS=$(python -c "import json; print(json.load(open('/tmp/lint-summary.json'))['baseline_error_count'])")
          AFTER_ERRORS=$(python -c "import json; print(json.load(open('/tmp/lint-summary.json'))['after_error_count'])")
          cat > evidence/E0_PR_002_RUNTIME_EVIDENCE_v1.md <<EOF
          # E0-PR-002 Runtime Evidence v1

          **Date:** 2026-08-16  
          **Repository:** \`Reguluspt/CEN-Value-RE\`  
          **Baseline:** \`94ff266a3686b5b5bfd98cb55459dbe7a6cf24d8\`

          ## Dependency materialization
          - Node: 22.13.0
          - \`npm install --save-exact @astryxdesign/core@0.2.0 @astryxdesign/theme-neutral@0.2.0 @stylexjs/stylex@0.19.0\`: PASS
          - \`package-lock.json\`: updated and version-controlled
          - \`node_modules/\`: runtime-only, not version-controlled

          ## Verification
          - \`npm run verify:re-astryx\`: PASS
          - scoped ESLint on E0-PR-002 JS files: PASS
          - full legacy lint non-regression: PASS
            - baseline legacy errors: $BASE_ERRORS
            - after E0-PR-002 errors: $AFTER_ERRORS
            - unchanged-file lint regressions: 0
          - \`npm run build\`: PASS
          - browser smoke: PASS
            - \`/re\` renders as admin
            - Astryx AppShell/SideNav/FormLayout/TextInput surface renders
            - \`/dashboard\` computed styles unchanged after visiting \`/re\`
            - \`/cases\` computed styles unchanged after visiting \`/re\`
            - browser page errors: 0

          ## Acceptance note
          This is implementation evidence only. E0-PR-002 is not self-accepted by this workflow.
          EOF

          cp /tmp/astryx-static.log evidence/E0-PR-002_static_verification_runtime_v1.log
          cp /tmp/astryx-scoped-lint.log evidence/E0-PR-002_scoped_lint_v1.log
          cp /tmp/astryx-build.log evidence/E0-PR-002_build_v1.log
          cp /tmp/astryx-browser-smoke.log evidence/E0-PR-002_browser_smoke_v1.log
          cp /tmp/lint-summary.json evidence/E0-PR-002_lint_nonregression_v1.json

      - name: Repository guards
        shell: bash
        run: |
          set -euo pipefail
          test -f web/package-lock.json
          test -f web/src/re/ReShell.jsx
          test -f web/src/re/astryx.css
          test -f web/scripts/verify-re-astryx-spike.mjs
          test -z "$(git ls-files 'web/node_modules/**')"
          git diff --check

      - name: Commit E0-PR-002 implementation and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package.json web/package-lock.json web/src/App.jsx web/src/re web/scripts/verify-re-astryx-spike.mjs evidence/E0_PR_002_RUNTIME_EVIDENCE_v1.md evidence/E0-PR-002_static_verification_runtime_v1.log evidence/E0-PR-002_scoped_lint_v1.log evidence/E0-PR-002_build_v1.log evidence/E0-PR-002_browser_smoke_v1.log evidence/E0-PR-002_lint_nonregression_v1.json
          git commit -m 'E0-PR-002: integrate Astryx spike with runtime evidence'
          git push origin HEAD:agent/e0-pr-002-astryx
